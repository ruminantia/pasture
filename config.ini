[global]
remove_tags = script, style, noscript, iframe, button, svg, footer, nav
blacklist = Trump, Netanyahu, Mamdani, Israel, Hamas, Palestine, Palestinian, Gaza, Bolsonaro, Ukraine, Ukrainian, Islamic, Carney, Supreme Court, Tesla, Hezbollah, Maduro

[llm]
enabled = true
base_url = http://192.168.68.81:8080/v1
model = gemma
temperature = 1.0
timeout = 600

# Default system prompt for cleaning scraped articles:
# system_prompt = This is a scraped page (article). It contains some artifacts and loose ends. Please squeeze out its substance and rewrite it as a brief, well formatted, article.

[worldnews]
type = reddit
url = https://www.reddit.com/r/worldnews.json
blacklist = Iran, Qatar, Russia, Ukraine, Putin, Zelensky, NATO, Pope
interval = 60

[collapse]
type = reddit
url = https://www.reddit.com/r/collapse.json
blacklist = Iran, Qatar, Russia, Ukraine, Putin, Zelensky, NATO, Pope
interval = 60

[geopolitics]
type = reddit
url = https://www.reddit.com/r/geopolitics.json
blacklist = Iran, Qatar, Russia, Ukraine, Putin, Zelensky, NATO, Pope
interval = 60

